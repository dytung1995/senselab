   cx.fillStyle=col('--mute');cx.font='12px system-ui';cx.fillText('Mặt cắt: dây dẫn vuông góc mặt phẳng hình vẽ, B nằm ngang giữa hai cực nam châm',10,H-10)}
  else{const a=rad(p.al),hl=Math.min(W,H)*.34,ca=Math.cos(a),sa=Math.sin(a);
   if(sB)for(let i=-2;i<=2;i++){const y=y0+i*H/6;ln(30,y,W-30,y,A,1.2);for(let j=1;j<6;j++)ah(30+(W-60)*j/6,y,sB>0?0:Math.PI,8,A)}
   ln(x0-hl*ca,y0+hl*sa,x0+hl*ca,y0-hl*sa,FG,7);const d=sI>=0?1:-1;if(sI)ah(x0+d*hl*.55*ca,y0-d*hl*.55*sa,Math.atan2(-d*sa,d*ca),14,'#d97706');
   cx.strokeStyle=FG;cx.lineWidth=1.5;cx.beginPath();cx.arc(x0,y0,46,-a,0);cx.stroke();cx.fillStyle=FG;cx.font='14px system-ui';cx.fillText('α',x0+52,y0-8);
   const Fz=-I*B*p.L*sa;if(Math.abs(Fz)>1e-9){const fx=W-80,fy=H-70;sym(fx,fy,20,Fz>0?1:-1);cx.fillStyle=R;cx.font='bold 14px system-ui';cx.fillText('Lực F',fx-22,fy-30)}
   cx.fillStyle=col('--mute');cx.font='12px system-ui';cx.fillText('Nhìn từ trên: dây và B cùng nằm trong mặt phẳng hình vẽ, lực F vuông góc mặt phẳng',10,H-10)}}},

balance:{name:'⚖️ Cân dòng điện',nog:true,
 desc:'Cân dòng điện đo lực giữa hai dây dẫn song song có dòng điện: <code>F = μ₀·I₁·I₂·L/(2π·d)</code>. Hai dòng cùng chiều thì hút nhau, ngược chiều thì đẩy nhau. Dây trên gắn ở đầu trái đòn cân; chỉnh quả cân bên phải (hoặc bên trái nếu giá trị âm) để đòn cân nằm ngang, khi đó lực từ cân bằng trọng lượng. Đây là nguyên lý dùng để định nghĩa đơn vị ampe.',
 params:[['I1','Dòng điện dây dưới I₁ (A)',-20,20,1,10],['I2','Dòng điện dây trên I₂ (A)',-20,20,1,10],['d','Khoảng cách hai dây d (mm)',5,50,1,20],['L','Chiều dài dây L (cm)',5,30,1,20],['m','Quả cân (mg), âm = đặt bên dây',-200,200,1,20]],
 fz(p){return 2e-7*p.I1*p.I2*(p.L/100)/(p.d/1000)},
 reset(p){return{t:0,phi:0,w:0}},
 step(s,p,dt){const net=EX.balance.fz(p)-p.m*1e-6*9.81,tg=14*Math.tanh(net/2e-4);s.w+=(-25*(s.phi-tg)-5*s.w)*dt;s.phi+=s.w*dt;s.t+=dt},
 val:()=>0,
 info(s,p){const F=EX.balance.fz(p),Wt=p.m*1e-6*9.81,net=F-Wt;return[['Lực giữa hai dây',f(Math.abs(F)*1000,3)+' mN ('+(F>1e-12?'hút':F<-1e-12?'đẩy':'không có')+')'],['Lực trên mỗi mét dây',f(Math.abs(F)/(p.L/100)*1000,2)+' mN/m'],['Trọng lượng quả cân',f(Wt*1000,3)+' mN'],['Khối lượng cần để cân bằng',Math.abs(F)<1e-12?'—':f(F/9.81*1e6,1)+' mg'],['Lực dư (lực từ − trọng lượng)',f(net*1000,3)+' mN'],['Trạng thái',Math.abs(net)<1e-5?'Cân bằng':net>0?'Nghiêng về phía dây':'Nghiêng về phía quả cân'],['Quy tắc','Cùng chiều: hút; ngược chiều: đẩy']]},
 draw(s,p){const cx0=W/2,cy0=H*.42,Lb=Math.min(W*.3,300),FG=col('--fg'),ph=rad(s.phi),c=Math.cos(ph),sn=Math.sin(ph),F=EX.balance.fz(p),net=F-p.m*1e-6*9.81;
  const lx=cx0-Lb*c,ly=cy0+Lb*sn,rx=cx0+Lb*c,ry=cy0-Lb*sn,hang=24,uy=ly+hang,lwx=cx0-Lb,lwy=cy0+hang+p.d*2.4;
  const sym=(x,y,o)=>{cx.fillStyle=col('--card');cx.strokeStyle=FG;cx.lineWidth=2.5;cx.beginPath();cx.arc(x,y,12,0,7);cx.fill();cx.stroke();cx.fillStyle=FG;if(o>0){cx.beginPath();cx.arc(x,y,3.5,0,7);cx.fill()}else if(o<0){cx.beginPath();cx.moveTo(x-6,y-6);cx.lineTo(x+6,y+6);cx.moveTo(x+6,y-6);cx.lineTo(x-6,y+6);cx.stroke()}};
  ln(cx0,cy0,cx0,H-24,col('--mute'),6);ln(cx0-50,H-24,cx0+50,H-24,col('--mute'),6);ln(lx,ly,rx,ry,FG,6);cx.fillStyle=col('--acc2');cx.beginPath();cx.arc(cx0,cy0,7,0,7);cx.fill();
  ln(lx,ly,lx,uy-12,FG,2);sym(lx,uy,Math.sign(p.I2));sym(lwx,lwy,Math.sign(p.I1));
  if(Math.abs(F)>1e-9){const len=Math.min(70,10+Math.abs(F)/2e-4*30),at=F>0,R='#dc2626';ln(lx+26,uy,lx+26,uy+(at?len:-len),R,3);ah(lx+26,uy+(at?len:-len),at?Math.PI/2:-Math.PI/2,10,R);ln(lwx+26,lwy,lwx+26,lwy+(at?-len:len),R,3);ah(lwx+26,lwy+(at?-len:len),at?-Math.PI/2:Math.PI/2,10,R)}
  const blk=(x,y,t,sz)=>{cx.fillStyle=col('--acc');cx.fillRect(x-sz/2,y,sz,sz*.7);cx.fillStyle='#fff';cx.font='11px system-ui';cx.textAlign='center';cx.fillText(t,x,y+sz*.45);cx.textAlign='left'};
  const bs=16+Math.sqrt(Math.abs(p.m))*3.2;
  if(p.m>0){ln(rx,ry,rx,ry+30,FG,2);ln(rx-36,ry+30,rx+36,ry+30,FG,4);blk(rx,ry+30-bs*.7,p.m+' mg',bs)}
  else if(p.m<0){const px=cx0-.7*Lb*c,py=cy0+.7*Lb*sn;ln(px,py,px,py+20,FG,2);ln(px-28,py+20,px+28,py+20,FG,4);blk(px,py+20+4,Math.abs(p.m)+' mg',bs)}
  cx.fillStyle=col('--mute');cx.font='12px system-ui';cx.fillText('Dây trên I₂ (gắn vào đòn cân)',lx+40,uy-14);cx.fillText('Dây dưới I₁ (cố định)',lwx+40,lwy+4);
  if(Math.abs(net)<1e-5){cx.fillStyle=col('--grn');cx.font='bold 18px system-ui';cx.textAlign='center';cx.fillText('CÂN BẰNG',cx0,34);cx.textAlign='left'}}}
,

fric:{name:'🧱 Lực ma sát',tw:()=>20,
 desc:'Vật khối lượng m trên mặt phẳng ngang chịu áp lực <code>N = mg</code>. Khi kéo bằng lực F: nếu <code>F ≤ μ_s·N</code> vật đứng yên và ma sát nghỉ bằng đúng F; khi <code>F > μ_s·N</code> vật trượt, ma sát trượt không đổi <code>F_ms = μ_k·N</code> (μ_k < μ_s) và gia tốc <code>a = (F − μ_k·N)/m</code>. Bật chế độ tăng lực tự động để thấy ma sát nghỉ tăng dần rồi tụt xuống khi vật bắt đầu trượt.',
 params:[['m','Khối lượng m (kg)',1,20,.5,5],['mus','Hệ số ma sát nghỉ μ_s',.1,1,.05,.5],['muk','Hệ số ma sát trượt μ_k',.05,1,.05,.3],['F','Lực kéo F (N); khi tăng dần là giá trị tối đa',0,100,1,60],['ramp','Lực kéo',0,1,1,1]],
 gl:'Lực kéo F (xanh dương) và lực ma sát (đỏ), đơn vị N',
 reset(p){return{t:0,x:0,v:0,Fa:0,fr:0}},
 step(s,p,dt){const N=p.m*9.81,mk=Math.min(p.muk,p.mus);s.t+=dt;s.Fa=p.ramp?p.F*Math.min(1,s.t/15):p.F;if(s.v==0&&s.Fa<=p.mus*N){s.fr=s.Fa}else{s.fr=mk*N;s.v+=(s.Fa-s.fr)/p.m*dt;if(s.v<=0){s.v=0;s.fr=Math.min(s.Fa,p.mus*N)}}s.x+=s.v*dt},
 val:s=>[s.Fa,s.fr],
 info(s,p){const N=p.m*9.81;return[['Áp lực N = mg',f(N,1)+' N'],['Ma sát nghỉ cực đại μ_s·N',f(p.mus*N,1)+' N'],['Ma sát trượt μ_k·N',f(Math.min(p.muk,p.mus)*N,1)+' N'],['Lực kéo F',f(s.Fa,1)+' N'],['Lực ma sát hiện tại',f(s.fr,1)+' N'],['Vận tốc',f(s.v,2)+' m/s'],['Trạng thái',s.v>0?'Trượt (ma sát trượt)':'Đứng yên (ma sát nghỉ)']]},
 draw(s,p){const gy=H*.62,bw=100,bh=64,bx=W*.4-bw/2;ln(0,gy,W,gy,col('--mute'),3);for(let i=-1;i<W/40+2;i++){const x=i*40-(s.x*40)%40;ln(x,gy,x-8,gy+12,col('--mute'),2)}
  cx.fillStyle=col('--acc');cx.fillRect(bx,gy-bh,bw,bh);cx.strokeStyle=col('--fg');cx.lineWidth=2;cx.strokeRect(bx,gy-bh,bw,bh);cx.fillStyle='#fff';cx.font='bold 16px system-ui';cx.textAlign='center';cx.fillText(p.m+' kg',bx+bw/2,gy-bh/2+6);cx.textAlign='left';
  const L1=Math.min(220,s.Fa*2.4),L2=Math.min(220,s.fr*2.4),y1=gy-bh/2;
  if(L1>1){ln(bx+bw,y1,bx+bw+L1,y1,'#2563eb',4);ah(bx+bw+L1,y1,0,13,'#2563eb');cx.fillStyle='#2563eb';cx.font='bold 14px system-ui';cx.fillText('F = '+f(s.Fa,1)+' N',bx+bw+8,y1-10)}
  if(L2>1){ln(bx,y1+14,bx-L2,y1+14,'#dc2626',4);ah(bx-L2,y1+14,Math.PI,13,'#dc2626');cx.fillStyle='#dc2626';cx.font='bold 14px system-ui';mt(cx,'F_ms = '+f(s.fr,1)+' N',Math.max(4,bx-L2),y1+36)}
  cx.fillStyle=col('--mute');cx.font='13px system-ui';cx.fillText(s.v>0?'Vật đang trượt – ma sát trượt':'Vật đứng yên – ma sát nghỉ',10,22)}},

incl:{name:'📐 Mặt phẳng nghiêng',nog:true,
 desc:'Vật trên mặt phẳng nghiêng góc θ chịu trọng lực <code>P = mg</code> phân tích thành <code>P_x = mg·sinθ</code> (kéo xuống dọc mặt phẳng) và <code>P_y = mg·cosθ</code> (ép vuông góc, cân bằng với phản lực <code>N = mg·cosθ</code>). Ma sát <code>F_ms = μN</code>. Vật trượt khi <code>tanθ > μ</code> với gia tốc <code>a = g(sinθ − μ·cosθ)</code>, ngược lại vật đứng yên.',
 params:[['th','Góc nghiêng θ (°)',0,70,1,30],['mu','Hệ số ma sát μ',0,1,.05,.3],['m','Khối lượng m (kg)',1,10,.5,2]],
 acc(p){const t=rad(p.th),a=9.81*(Math.sin(t)-p.mu*Math.cos(t));return a>0?a:0},
 reset(p){return{t:0,s:0,v:0}},
 step(s,p,dt){s.t+=dt;s.v+=EX.incl.acc(p)*dt;s.s+=s.v*dt;if(s.s>4.5){s.s=0;s.v=0}},
 val:()=>0,
 info(s,p){const t=rad(p.th),g=p.m*9.81,N=g*Math.cos(t),Px=g*Math.sin(t),Ff=p.mu*N;return[['Trọng lực P = mg',f(g,1)+' N'],['P_x = mg·sinθ',f(Px,1)+' N'],['N = P_y = mg·cosθ',f(N,1)+' N'],['Ma sát cực đại μN',f(Ff,1)+' N'],['Gia tốc a',f(EX.incl.acc(p),2)+' m/s²'],['Góc ma sát arctanμ',f(Math.atan(p.mu)*180/Math.PI,1)+'°'],['Trạng thái',Px>Ff?'Trượt xuống':'Đứng yên (tanθ ≤ μ)'],['Vận tốc',f(s.v,2)+' m/s']]},
 draw(s,p){const t=rad(p.th),c=Math.cos(t),sn=Math.sin(t),gy=H-40,Lpx=Math.min(W*.62/Math.max(c,.3),(H-110)/Math.max(sn,.2)),sc=Lpx/5,xr=W*.75,tp=[xr-Lpx*c,gy-Lpx*sn];
  cx.fillStyle=col('--line');cx.beginPath();cx.moveTo(tp[0],tp[1]);cx.lineTo(xr,gy);cx.lineTo(tp[0],gy);cx.closePath();cx.fill();ln(tp[0],tp[1],xr,gy,col('--fg'),3);ln(0,gy,W,gy,col('--mute'),2);
  const nx=sn,ny=-c,pos=[tp[0]+s.s*sc*c,tp[1]+s.s*sc*sn],ct=[pos[0]+nx*30,pos[1]+ny*30];
  cx.save();cx.translate(ct[0],ct[1]);cx.rotate(t);cx.fillStyle=col('--acc');cx.fillRect(-45,-30,90,60);cx.fillStyle='#fff';cx.font='bold 14px system-ui';cx.textAlign='center';cx.fillText(p.m+' kg',0,5);cx.restore();cx.textAlign='left';
  const g=p.m*9.81,Px=g*sn,Pn=g*c,Ff=Math.min(Px,p.mu*Pn),lo=F=>Math.min(130,F*2.2),ar=(dx,dy,L,k,tx)=>{ln(ct[0],ct[1],ct[0]+dx*L,ct[1]+dy*L,k,3);ah(ct[0]+dx*L,ct[1]+dy*L,Math.atan2(dy,dx),10,k);cx.fillStyle=k;cx.font='bold 13px system-ui';mt(cx,tx,ct[0]+dx*L+6,ct[1]+dy*L+4)};
  ar(0,1,lo(g),'#dc2626','P');ar(nx,ny,lo(Pn),'#059669','N');cx.setLineDash([4,4]);ar(c,sn,lo(Px),'#d97706','P_x');ar(-nx,-ny,lo(Pn),'#d97706','P_y');cx.setLineDash([]);if(Ff>.05)ar(-c,-sn,lo(Ff),'#2563eb','F_ms');
  cx.strokeStyle=col('--fg');cx.lineWidth=1.5;cx.beginPath();cx.arc(xr,gy,50,Math.PI,Math.PI+t);cx.stroke();cx.fillStyle=col('--fg');cx.font='14px system-ui';cx.fillText('θ = '+p.th+'°',xr-110,gy-8)}},

mom:{name:'🎱 Bảo toàn động lượng',tw:()=>12,
 desc:'Trong hệ kín (không có ngoại lực) tổng động lượng được bảo toàn: <code>m₁v₁ + m₂v₂ = m₁v′₁ + m₂v′₂</code>. Va chạm đàn hồi (e = 1) bảo toàn cả động năng; va chạm mềm (e = 0) hai vật dính nhau cùng vận tốc và mất nhiều động năng nhất. Hệ số khôi phục <code>e = −{v′₂ − v′₁|v₂ − v₁}</code>.',
 params:[['m1','Khối lượng vật 1 m₁ (kg)',.5,5,.5,2],['m2','Khối lượng vật 2 m₂ (kg)',.5,5,.5,1],['v1','Vận tốc vật 1 v₁ (m/s)',-6,6,.5,3],['v2','Vận tốc vật 2 v₂ (m/s)',-6,6,.5,-1],['e','Hệ số khôi phục e (0 = mềm, 1 = đàn hồi)',0,1,.05,1]],
 gl:'Tổng động lượng p (xanh dương, kg·m/s) và tổng động năng K (đỏ, J)',
 reset(p){const pt=p.m1*p.v1+p.m2*p.v2,k=.5*p.m1*p.v1*p.v1+.5*p.m2*p.v2*p.v2;return{t:0,x1:-5,x2:5,v1:p.v1,v2:p.v2,hit:false,pb:pt,kb:k,pt,k}},
 step(s,p,dt){s.t+=dt;s.x1+=s.v1*dt;s.x2+=s.v2*dt;if(!s.hit&&s.x2-s.x1<=1&&s.v1>s.v2){const M=p.m1+p.m2,a=s.v1,b=s.v2;s.v1=((p.m1-p.e*p.m2)*a+(1+p.e)*p.m2*b)/M;s.v2=((p.m2-p.e*p.m1)*b+(1+p.e)*p.m1*a)/M;s.hit=true}s.pt=p.m1*s.v1+p.m2*s.v2;s.k=.5*p.m1*s.v1*s.v1+.5*p.m2*s.v2*s.v2},
 val:s=>[s.pt,s.k],
 info(s,p){return[['Trạng thái',s.hit?'Đã va chạm':p.v1>p.v2?'Chưa va chạm':'Không va chạm (v₁ ≤ v₂)'],['Động lượng trước va chạm',f(s.pb,2)+' kg·m/s'],['Động lượng hiện tại',f(s.pt,2)+' kg·m/s'],['Động năng trước',f(s.kb,2)+' J'],['Động năng hiện tại',f(s.k,2)+' J'],['Động năng mất đi',f(s.kb-s.k,2)+' J'],['v₁ / v₂',f(s.v1,2)+' / '+f(s.v2,2)+' m/s']]},
 draw(s,p){const gy=H*.62,sc=(W-60)/18,X=x=>W/2+x*sc,bh=sc*.7;ln(30,gy,W-30,gy,col('--mute'),3);
  [[s.x1,p.m1,s.v1,col('--acc')],[s.x2,p.m2,s.v2,col('--acc2')]].forEach(([x,m,v,k],i)=>{const px=X(x);cx.fillStyle=k;cx.fillRect(px-sc/2,gy-bh-6,sc,bh);cx.fillStyle=col('--fg');cx.beginPath();cx.arc(px-sc*.28,gy-3,4.5,0,7);cx.arc(px+sc*.28,gy-3,4.5,0,7);cx.fill();cx.fillStyle='#fff';cx.font='bold '+Math.max(10,sc*.3)+'px system-ui';cx.textAlign='center';cx.fillText(m+' kg',px,gy-bh/2-2);cx.textAlign='left';
   const L=v*16;if(Math.abs(L)>2){const y=gy-bh-24;ln(px,y,px+L,y,'#059669',3);ah(px+L,y,L>0?0:Math.PI,10,'#059669');cx.fillStyle='#059669';cx.font='12px system-ui';cx.fillText('v'+(i+1)+' = '+f(v,2),Math.min(px,px+L),y-8)}});
  cx.fillStyle=col('--mute');cx.font='13px system-ui';cx.fillText(s.hit?'Đã va chạm (e = '+f(p.e,2)+')':p.v1>p.v2?'Chuẩn bị va chạm':'Hai vật không va chạm (v₁ ≤ v₂)',10,22);cx.fillText('p = '+f(s.pt,2)+' kg·m/s',W-150,22)}},

energy:{name:'🎢 Bảo toàn năng lượng',tw:()=>12,
 desc:'Quả cầu lăn trong lòng máng parabol: khi không ma sát cơ năng bảo toàn <code>E = ½mv² + mgh = const</code>, động năng và thế năng chuyển hóa qua lại. Khi có ma sát <code>F_ms = μN</code>, cơ năng giảm dần và chuyển thành nhiệt Q: <code>½mv² + mgh + Q = const</code> – năng lượng toàn phần vẫn được bảo toàn.',
 params:[['m','Khối lượng m (kg)',1,5,.5,2],['h0','Độ cao ban đầu h₀ (m)',1,5,.5,4],['mu','Hệ số ma sát μ',0,.2,.01,0]],
 gl:'Thế năng (xanh dương), động năng (đỏ), nhiệt Q (xanh lá), tổng (cam), đơn vị J',
 reset(p){const E=p.m*9.81*p.h0;return{t:0,x:-2*Math.sqrt(p.h0),v:0,Q:0,pe:E,ke:0,E0:E}},
 step(s,p,dt){const sl=.5*s.x,cs=1/Math.sqrt(1+sl*sl);let a=-9.81*sl*cs;if(p.mu>0){const fr=p.mu*9.81*cs;if(Math.abs(s.v)<1e-3&&Math.abs(a)<=fr){s.v=0;a=0}else a-=fr*Math.sign(s.v||a)}
  s.v+=a*dt;s.x+=s.v*cs*dt;s.Q+=p.mu*p.m*9.81*cs*Math.abs(s.v)*dt;s.t+=dt;s.pe=p.m*9.81*.25*s.x*s.x;s.ke=.5*p.m*s.v*s.v;s.E0=p.m*9.81*p.h0},
 val:s=>[s.pe,s.ke,s.Q,s.pe+s.ke+s.Q],
 info(s,p){return[['Độ cao h',f(.25*s.x*s.x,2)+' m'],['Vận tốc v',f(Math.abs(s.v),2)+' m/s'],['Thế năng mgh',f(s.pe,2)+' J'],['Động năng ½mv²',f(s.ke,2)+' J'],['Nhiệt tỏa ra Q',f(s.Q,2)+' J'],['Cơ năng (thế + động)',f(s.pe+s.ke,2)+' J'],['Năng lượng toàn phần',f(s.pe+s.ke+s.Q,2)+' J']]},
 draw(s,p){const ox=W*.3,sx=W*.5/12,sy=(H-120)/6.6,X=x=>ox+x*sx,Y=y=>H-44-y*sy;
  cx.strokeStyle=col('--fg');cx.lineWidth=3;cx.beginPath();for(let i=0;i<=52;i++){const x=-5.2+i*.2,px=X(x),py=Y(.25*x*x);i?cx.lineTo(px,py):cx.moveTo(px,py)}cx.stroke();
  const sl=.5*s.x,q=Math.sqrt(1+sl*sl),bx=X(s.x)-sl/q*10,by=Y(.25*s.x*s.x)-10/q;cx.fillStyle=col('--acc2');cx.beginPath();cx.arc(bx,by,10,0,7);cx.fill();
  const E0=s.E0||1,x0=W*.62,bw=W*.36/4,hb=H-120,names=['Thế năng','Động năng','Nhiệt Q','Tổng'],vals=[s.pe,s.ke,s.Q,s.pe+s.ke+s.Q],cols=[col('--acc'),col('--acc2'),col('--grn'),'#d97706'];
  ln(x0-6,H-44,W-12,H-44,col('--mute'),2);cx.setLineDash([4,4]);ln(x0-6,H-44-hb,W-12,H-44-hb,col('--mute'),1.2);cx.setLineDash([]);
  vals.forEach((v,i)=>{const h=Math.max(0,Math.min(1.1,v/E0))*hb;cx.fillStyle=cols[i];cx.fillRect(x0+i*bw+4,H-44-h,bw-8,h);cx.fillStyle=col('--mute');cx.font='11px system-ui';cx.textAlign='center';cx.fillText(names[i],x0+i*bw+bw/2,H-28);cx.fillText(f(v,1),x0+i*bw+bw/2,H-44-h-4)});cx.textAlign='left';cx.fillStyle=col('--mute');cx.font='12px system-ui';cx.fillText('E₀ = '+f(E0,1)+' J',x0-4,H-44-hb-6)}},

decay:{name:'☢️ Phân rã hạt nhân',tw:()=>30,
 desc:'Mỗi hạt nhân phân rã ngẫu nhiên với xác suất như nhau trong mỗi đơn vị thời gian, nên số hạt nhân còn lại giảm theo hàm mũ: <code>N = N₀·2^(−t/T)</code> với chu kỳ bán rã T, hằng số phân rã <code>λ = {ln 2|T}</code> và độ phóng xạ <code>H = λN</code>. Sau mỗi chu kỳ bán rã, một nửa số hạt nhân bị phân rã. Với N nhỏ, đường thực nghiệm dao động quanh đường lý thuyết.',
 params:[['T','Chu kỳ bán rã T (s)',1,10,.5,4],['N0','Số hạt nhân ban đầu N₀',50,400,10,300],['mode','Loại phân rã',0,2,1,0]],
 gl:'Số hạt nhân chưa phân rã: thực nghiệm (xanh dương), lý thuyết (đỏ)',
 reset(p){const n=p.N0,c=Math.ceil(Math.sqrt(n*1.8)),ps=[];for(let i=0;i<n;i++)ps.push({a:true,i});return{t:0,n,c,ps,N:n,th:n,pt:[]}},
 step(s,p,dt){s.t+=dt;const l=Math.LN2/p.T;for(const q of s.ps){if(q.a&&Math.random()<l*dt){q.a=false;s.N--;s.pt.push({i:q.i,a:Math.random()*6.283,l:0})}}s.pt.forEach(q=>{q.l+=dt});s.pt=s.pt.filter(q=>q.l<.9);s.th=s.n*Math.pow(2,-s.t/p.T)},
 val:s=>[s.N,s.th],
 info(s,p){return[['Thời gian',f(s.t,1)+' s'],['Hạt nhân chưa phân rã',s.N],['Hạt nhân đã phân rã',s.n-s.N],['Lý thuyết N₀·2^(−t/T)',f(s.th,1)],['Số chu kỳ bán rã đã qua',f(s.t/p.T,2)],['Hằng số phân rã λ',f(Math.LN2/p.T,3)+' s⁻¹'],['Độ phóng xạ H = λN',f(Math.LN2/p.T*s.N,1)+' Bq'],['Hạt phát ra',['Hạt α (He²⁺)','Hạt β⁻ (electron)','Tia γ (photon)'][p.mode]]]},
 draw(s,p){const c=s.c,rows=Math.ceil(s.n/c),cs=Math.min((W-40)/c,(H-60)/rows),gx=(W-c*cs)/2,gy=34,r=cs*.38,K=['#dc2626','#2563eb','#d97706'][p.mode],pc=i=>[gx+(i%c+.5)*cs,gy+(Math.floor(i/c)+.5)*cs];
  for(const q of s.ps){const[x,y]=pc(q.i);cx.beginPath();cx.arc(x,y,r,0,7);if(q.a){cx.fillStyle=col('--acc');cx.fill()}else{cx.strokeStyle=col('--line');cx.lineWidth=1.2;cx.stroke()}}
  for(const q of s.pt){const[x,y]=pc(q.i),d=q.l*60;cx.globalAlpha=1-q.l/.9;if(p.mode==2){cx.strokeStyle=K;cx.lineWidth=2;cx.beginPath();for(let i=0;i<=14;i++){const u=d+i*2,o=4*Math.sin(i*1.4),px=x+Math.cos(q.a)*u-Math.sin(q.a)*o,py=y+Math.sin(q.a)*u+Math.cos(q.a)*o;i?cx.lineTo(px,py):cx.moveTo(px,py)}cx.stroke()}else{cx.fillStyle=K;cx.beginPath();cx.arc(x+Math.cos(q.a)*d,y+Math.sin(q.a)*d,p.mode?2.5:4,0,7);cx.fill()}cx.globalAlpha=1}
  cx.fillStyle=col('--mute');cx.font='13px system-ui';cx.fillText('● chưa phân rã: '+s.N+'     ○ đã phân rã: '+(s.n-s.N),10,20)}},

bohr:{name:'⚛️ Mô hình nguyên tử Bohr',nog:true,
 desc:'Electron chuyển động tròn quanh hạt nhân chỉ trên các quỹ đạo có năng lượng xác định: <code>E_n = −{13,6·Z²|n²}</code> (eV), bán kính <code>r_n = a₀·{n²|Z}</code> (a₀ = 0,0529 nm). Khi electron nhảy từ mức cao n_i xuống mức thấp n_f, nguyên tử phát ra photon có năng lượng <code>hf = E_i − E_f</code>, bước sóng <code>λ = {hc|ΔE}</code>. Các dãy vạch: Lyman (về n = 1, tử ngoại), Balmer (về n = 2, nhìn thấy), Paschen (về n = 3, hồng ngoại). Electron tự chuyển mức ngẫu nhiên; các vạch nhìn thấy được ghi lại trên thanh quang phổ.',
 params:[['Z','Nguyên tử / ion giống hiđro',1,3,1,1],['nmax','Mức kích thích cao nhất n',2,7,1,5]],
 reset(p){return{t:0,n:Math.min(3,p.nmax),th:0,wait:1,tr:null,pr:0,lines:[],ph:0,last:null}},
 step(s,p,dt){s.t+=dt;s.th+=2.6/Math.pow(s.n,1.5)*dt;
  if(s.tr){s.pr+=dt/.7;if(s.pr>=1){s.n=s.tr.to;s.tr=null;s.wait=1.1}}
  else{s.wait-=dt;if(s.wait<=0){const to=s.n>1?1+Math.floor(Math.random()*(s.n-1)):2+Math.floor(Math.random()*(p.nmax-1)),Z2=13.6*p.Z*p.Z,dE=Math.abs(Z2/(s.n*s.n)-Z2/(to*to)),lam=1239.84/dE,em=to<s.n;
   s.tr={from:s.n,to,em};s.pr=0;s.last={from:s.n,to,lam,dE,em};if(em&&!s.lines.some(l=>Math.abs(l.lam-lam)<.01))s.lines.push({lam,from:s.n,to});s.ph=1}}
  if(s.ph>0)s.ph-=dt/1.4},
 val:()=>0,
 info(s,p){const Z=p.Z,n=s.n,l=s.last,vis=l?(l.lam>=380&&l.lam<=780?'nhìn thấy':l.lam<380?'tử ngoại':'hồng ngoại'):'',sr=l&&l.em?({1:'Lyman',2:'Balmer',3:'Paschen',4:'Brackett'}[l.to]||'—'):'—';
  return[['Mức năng lượng n',n],['Năng lượng E_n',f(-13.6*Z*Z/(n*n),2)+' eV'],['Bán kính r_n',f(.0529*n*n/Z,3)+' nm'],['Tốc độ electron',f(2.19*Z/n,2)+' ×10⁶ m/s'],['Chuyển mức',s.tr?(s.tr.em?'Phát xạ ':'Hấp thụ ')+s.tr.from+' → '+s.tr.to:'Ổn định'],['Photon gần nhất',l?f(l.lam,1)+' nm ('+vis+')':'—'],['Dãy vạch',sr],['Số vạch đã ghi',s.lines.length]]},
 draw(s,p){const ax=W*.28,ay=H*.44,sc=Math.min(18,(H*.34)/p.nmax),R=n=>sc*n+10,Z2=13.6*p.Z*p.Z,FG=col('--fg');
  for(let n=1;n<=p.nmax;n++){cx.strokeStyle=col('--line');cx.lineWidth=1.5;cx.beginPath();cx.arc(ax,ay,R(n),0,7);cx.stroke()}
  cx.fillStyle='#dc2626';cx.beginPath();cx.arc(ax,ay,8,0,7);cx.fill();cx.fillStyle='#fff';cx.font='bold 11px system-ui';cx.textAlign='center';cx.fillText('+',ax,ay+4);cx.textAlign='left';
  const sm=t=>t*t*(3-2*t);let rr=R(s.n);if(s.tr){const e=sm(Math.min(1,s.pr));rr=R(s.tr.from)+(R(s.tr.to)-R(s.tr.from))*e}
  cx.fillStyle='#2563eb';cx.beginPath();cx.arc(ax+rr*Math.cos(s.th),ay+rr*Math.sin(s.th),5.5,0,7);cx.fill();
  const ph=s.last,vis=ph&&ph.lam>=380&&ph.lam<=780,kc=ph?(vis?'rgb('+rgb(ph.lam).join(',')+')':'#9ca3af'):'#9ca3af';
  if(ph&&s.ph>0){const u=1-s.ph,a=ph.em?-.55:Math.PI+.55,D=R(p.nmax)+20+(ph.em?u:1-u)*(W*.2),sg=ph.em?-1:1,px=ax+D*Math.cos(a),py=ay+D*Math.sin(a);cx.globalAlpha=Math.min(1,s.ph*2);cx.strokeStyle=kc;cx.lineWidth=3;cx.beginPath();for(let i=0;i<=40;i++){const d=i*2,off=7*Math.sin(d/3.2+(ph.em?-1:1)*s.t*14),x=px+sg*Math.cos(a)*d-Math.sin(a)*off,y=py+sg*Math.sin(a)*d+Math.cos(a)*off;i?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke();cx.fillStyle=kc;cx.font='bold 13px system-ui';cx.fillText(f(ph.lam,0)+' nm',px+8,py-8);cx.globalAlpha=1}
  const dx0=W*.6,dx1=W*.93,Y=n=>H-70-(H-120)*(1-1/(n*n));cx.font='11px system-ui';
  for(let n=1;n<=7;n++){const on=n<=p.nmax;ln(dx0,Y(n),dx1,Y(n),col(on?'--fg':'--line'),on?2:1);cx.fillStyle=col('--mute');cx.fillText('n='+n,dx0-30,Y(n)+4);if(n<=3)cx.fillText(f(-Z2/(n*n),2)+' eV',dx1-62,Y(n)-4)}
  let ye=Y(s.n);if(s.tr){const e=sm(Math.min(1,s.pr));ye=Y(s.tr.from)+(Y(s.tr.to)-Y(s.tr.from))*e;ln((dx0+dx1)/2+40,Y(s.tr.from),(dx0+dx1)/2+40,ye,kc,3);ah((dx0+dx1)/2+40,ye,s.tr.to<s.tr.from?Math.PI/2:-Math.PI/2,9,kc)}
  cx.fillStyle='#2563eb';cx.beginPath();cx.arc((dx0+dx1)/2-20,ye,6,0,7);cx.fill();
  const sx0=20,sx1=W-20,sy=H-34,sw=sx1-sx0;for(let i=0;i<sw;i+=2){const l=380+370*i/sw;cx.fillStyle='rgb('+rgb(l).join(',')+')';cx.fillRect(sx0+i,sy,2,14)}
  s.lines.forEach(l=>{if(l.lam>=380&&l.lam<=750)ln(sx0+(l.lam-380)/370*sw,sy-3,sx0+(l.lam-380)/370*sw,sy+17,'#000',2)});
  cx.fillStyle=col('--mute');cx.fillText('380 nm',sx0,sy-6);cx.fillText('750 nm',sx1-40,sy-6);cx.fillText('Quang phổ vạch (vùng nhìn thấy) – vạch đen là photon đã phát',sx0+70,sy-6)}},

ruth:{name:'🎯 Mô hình Rutherford',nog:true,
 desc:'Thí nghiệm bắn hạt α vào lá vàng. Mô hình Thomson (khối điện tích dương trải đều) chỉ cho lệch rất nhỏ; thực nghiệm cho thấy một số ít hạt α bị lệch góc lớn, thậm chí bật ngược, nên Rutherford đề xuất hạt nhân nhỏ, đặc, mang điện dương ở tâm nguyên tử. Góc lệch liên hệ với thông số va chạm b: <code>tan(θ/2) = d/(2b)</code>, với khoảng tiến gần nhất khi đối đầu <code>d = {Z₁Z₂e²|4πε₀E}</code>. Mô phỏng dùng một hạt nhân duy nhất và chùm tia rộng ±120 fm nên tỉ lệ bật ngược cao hơn thực tế.',
 params:[['Z','Điện tích hạt nhân Z (vàng: 79)',10,100,1,79],['E','Năng lượng hạt α (MeV)',2,10,.5,5],['mode','Mô hình nguyên tử',0,1,1,1]],
 reset(p){return{t:0,ps:[],cnt:[0,0,0,0,0],n:0,sp:0}},
 step(s,p,dt){s.t+=dt;const dfm=2.88*p.Z/p.E,dpx=H*.42/120*dfm,bm=120/dfm,v0=350/dpx,xl=-W*.4/dpx,xr=W*.6/dpx,yb=H*.5/dpx;s.sp+=dt*10;
  while(s.sp>=1){s.sp--;s.ps.push({x:xl,y:(Math.random()*2-1)*bm,vx:v0,vy:p.mode?0:(Math.random()-.5)*v0*.03,tr:[],lt:0})}
  const k=Math.max(1,Math.ceil(v0*dt/.1)),h=dt/k;
  for(const q of s.ps){for(let j=0;j<k;j++){if(p.mode==1){const r2=Math.max(q.x*q.x+q.y*q.y,.04),r=Math.sqrt(r2),a=.5*v0*v0/r2;q.vx+=a*q.x/r*h;q.vy+=a*q.y/r*h}q.x+=q.vx*h;q.y+=q.vy*h}
   q.lt+=dt;if(q.lt>.025){q.lt=0;q.tr.push([W*.4+q.x*dpx,H/2+q.y*dpx]);if(q.tr.length>90)q.tr.shift()}
   if(q.x>xr||q.x<xl-.5||Math.abs(q.y)>yb){q.dead=true;const th=Math.abs(Math.atan2(q.vy,q.vx))*180/Math.PI;s.n++;s.cnt[th<5?0:th<20?1:th<45?2:th<90?3:4]++}}
  s.ps=s.ps.filter(q=>!q.dead)},
 val:()=>0,
 info(s,p){const n=Math.max(1,s.n),c=s.cnt;return[['Khoảng tiến gần nhất d',f(2.88*p.Z/p.E,1)+' fm'],['Hạt α đã đi qua',s.n],['Lệch trên 20°',f((c[2]+c[3]+c[4])/n*100,1)+'%'],['Lệch trên 90° (bật ngược)',c[4]+' ('+f(c[4]/n*100,1)+'%)'],['Mô hình',p.mode?'Rutherford (hạt nhân)':'Thomson (khối đều)'],['Kết luận',p.mode?'Có hạt bật ngược → hạt nhân nhỏ, đặc':'Chỉ lệch rất nhỏ, trái thực nghiệm']]},
 draw(s,p){const cxn=W*.4,cyn=H/2,dfm=2.88*p.Z/p.E,dpx=H*.42/120*dfm,R=H*.42;
  if(p.mode==0){cx.fillStyle='rgba(244,114,182,.22)';cx.beginPath();cx.arc(cxn,cyn,R,0,7);cx.fill();cx.fillStyle='#2563eb';for(let i=0;i<9;i++){const a=i*2.4,r=R*(.25+.6*((i*5)%7)/7);cx.beginPath();cx.arc(cxn+r*Math.cos(a),cyn+r*Math.sin(a),3,0,7);cx.fill()}}
  else{cx.setLineDash([4,5]);cx.strokeStyle=col('--mute');cx.lineWidth=1;cx.beginPath();cx.arc(cxn,cyn,R,0,7);cx.stroke();cx.setLineDash([]);cx.fillStyle='#dc2626';cx.beginPath();cx.arc(cxn,cyn,5,0,7);cx.fill()}
  cx.strokeStyle=col('--acc');cx.lineWidth=1.6;cx.globalAlpha=.7;for(const q of s.ps){cx.beginPath();q.tr.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.stroke()}cx.globalAlpha=1;
  cx.fillStyle=col('--acc2');for(const q of s.ps){cx.beginPath();cx.arc(cxn+q.x*dpx,cyn+q.y*dpx,3.5,0,7);cx.fill()}
  const hx=W*.74,hw=W*.24,names=['<5°','5–20°','20–45°','45–90°','>90°'],mx=Math.log10(1+Math.max(1,...s.cnt)),bh=H*.5,hy=H*.78,bw=hw/5;
  ln(hx-4,hy,hx+hw,hy,col('--mute'),2);s.cnt.forEach((c,i)=>{const h=Math.log10(1+c)/mx*bh;cx.fillStyle=i==4?col('--acc2'):col('--acc');cx.fillRect(hx+i*bw+3,hy-h,bw-6,h);cx.fillStyle=col('--mute');cx.font='10px system-ui';cx.textAlign='center';cx.fillText(names[i],hx+i*bw+bw/2,hy+13);cx.fillText(c,hx+i*bw+bw/2,hy-h-4)});cx.textAlign='left';
  cx.fillStyle=col('--mute');cx.font='12px system-ui';cx.fillText('Số hạt theo góc lệch (thang log)',hx-4,hy-bh-14);cx.fillText(p.mode?'Hạt nhân đặc ở tâm (chấm đỏ)':'Khối điện tích dương trải đều (màu hồng)',10,H-12)}},

ptable:{name:'🗂️ Bảng tuần hoàn các nguyên tố',...ST,
 desc:'Bảng tuần hoàn gồm 118 nguyên tố xếp theo số hiệu nguyên tử Z tăng dần: mỗi hàng là một chu kỳ, mỗi cột là một nhóm có tính chất tương tự. Bấm vào ô nguyên tố (hoặc kéo thanh trượt Z) để xem khối lượng, cấu hình electron, nhóm, chu kỳ và loại nguyên tố; di chuột để làm nổi bật cả nhóm cùng loại.',

{id:'benzen',n:'Benzen',sm:['c1ccccc1'],geo:'Lục giác đều phẳng, C–C = 1,40 Å, góc 120°; 6 C lai hóa sp²',typ:'Hiđrocacbon thơm',desc:'Benzen <code>C₆H₆</code> có 6 nguyên tử C lai hóa sp² tạo vòng lục giác đều phẳng. Sáu electron π không định chỗ trên toàn vòng (hệ liên hợp) làm mọi liên kết C–C dài bằng nhau (1,40 Å, trung gian giữa đơn và đôi) và vòng rất bền. Nét đứt biểu diễn liên kết π liên hợp.'},
{id:'metanol',n:'Metanol',sm:['CO'],geo:'C lai hóa sp³ (tứ diện); góc C–O–H ≈ 108°',typ:'Ancol no, đơn chức (nhóm –OH)',desc:'Metanol <code>CH₃OH</code>: nhóm hiđroxyl –OH gắn vào C no. Liên kết O–H phân cực tạo được liên kết hiđro, nên metanol tan vô hạn trong nước và có nhiệt độ sôi cao hơn nhiều so với metan.'},
{id:'etanol',n:'Etanol',sm:['CCO'],geo:'Các C lai hóa sp³; C–O = 1,43 Å; góc C–O–H ≈ 108°',typ:'Ancol no, đơn chức (nhóm –OH)',desc:'Etanol <code>C₂H₅OH</code> (rượu etylic) gồm gốc etyl C₂H₅– liên kết với nhóm –OH. Phần –OH phân cực (ưa nước), gốc etyl kị nước; nhờ liên kết hiđro giữa các phân tử nên etanol sôi ở 78 °C, cao hơn nhiều so với etan.'},
{id:'phenol',n:'Phenol',sm:['c1ccccc1O'],geo:'Vòng benzen phẳng, nhóm –OH nằm trong mặt phẳng vòng; C–O = 1,36 Å',typ:'Phenol (–OH gắn trực tiếp vào vòng benzen)',desc:'Phenol <code>C₆H₅OH</code>: nhóm –OH gắn trực tiếp vào vòng benzen. Cặp electron của O liên hợp với vòng thơm làm liên kết C–O ngắn hơn ở ancol và liên kết O–H phân cực mạnh hơn, nên phenol có tính axit yếu (mạnh hơn ancol) và dễ thế vào vị trí ortho, para.'},

{id:'axetic',n:'Axit axetic',sm:['CC(=O)O'],geo:'Nhóm –COOH phẳng; C=O = 1,21 Å, C–O = 1,36 Å; C của –COOH lai hóa sp²',typ:'Axit cacboxylic (nhóm –COOH)',desc:'Axit axetic <code>CH₃COOH</code>: nhóm cacboxyl gồm C=O và –OH liên hợp với nhau, tất cả nằm trong một mặt phẳng. Liên kết O–H phân cực mạnh nên H dễ tách ra dưới dạng H⁺ (tính axit); các phân tử còn tạo dime nhờ liên kết hiđro.'},
{id:'este',n:'Este (axetat)',sm:['CC(=O)OC','CC(=O)OCC'],vl:'Este',vo:['Metyl axetat','Etyl axetat'],geo:'Nhóm –COO– phẳng (sp²); liên kết C–O–C có góc ≈ 117°',typ:'Este (nhóm –COO–)',desc:'Este <code>CH₃COOR</code> được tạo từ axit cacboxylic và ancol (phản ứng este hóa, loại 1 phân tử nước). Nhóm –COO– phẳng, không còn H linh động nên este không tạo liên kết hiđro với nhau và sôi thấp hơn axit, ancol tương ứng; nhiều este có mùi thơm trái cây.'},
{id:'glucozo',n:'Glucozơ',vl:'Dạng vòng',vo:['α-glucozơ','β-glucozơ'],geo:'Vòng 6 cạnh (piranozơ) dạng ghế; ở β-glucozơ mọi nhóm –OH và –CH₂OH đều ở vị trí xích đạo',typ:'Monosaccarit (aldohexozơ)',desc:'Glucozơ <code>C₆H₁₂O₆</code> tồn tại chủ yếu ở dạng vòng 6 cạnh. Hai dạng α và β khác nhau ở vị trí nhóm –OH hemiaxetal (C1): ở α-glucozơ –OH nằm ở vị trí trục, ở β-glucozơ nằm ở vị trí xích đạo. Trong dung dịch hai dạng chuyển hóa qua dạng mạch hở có nhóm –CHO.'},
{id:'fructozo',n:'Fructozơ',vl:'Dạng vòng',vo:['Vòng 6 cạnh','Vòng 5 cạnh'],geo:'Xetohexozơ; vòng piranozơ (ghế) hoặc furanozơ (5 cạnh, gần phẳng)',typ:'Monosaccarit (xetohexozơ)',desc:'Fructozơ <code>C₆H₁₂O₆</code> là đồng phân của glucozơ, có nhóm cacbonyl ở C2 (nhóm xeton). Ở dạng tự do tồn tại chủ yếu là vòng 6 cạnh; trong saccarozơ nó ở dạng vòng 5 cạnh (furanozơ). Là đường ngọt nhất trong các loại đường.'},
{id:'saccarozo',n:'Saccarozơ',geo:'Gồm gốc α-glucozơ (vòng 6) và β-fructozơ (vòng 5) nối qua cầu O 1→2',typ:'Đisaccarit không khử',desc:'Saccarozơ <code>C₁₂H₂₂O₁₁</code> (đường mía) gồm một gốc α-glucozơ và một gốc β-fructozơ liên kết với nhau bằng liên kết glicozit C1–O–C2, loại đi một phân tử nước. Cả hai nhóm OH hemiaxetal đều tham gia liên kết nên saccarozơ không có tính khử; khi thủy phân thu được glucozơ và fructozơ.'},
{id:'mantozo',n:'Mantozơ',geo:'Hai gốc α-glucozơ nối bằng liên kết α-1,4-glicozit (C1–O–C4)',typ:'Đisaccarit có tính khử',desc:'Mantozơ <code>C₁₂H₂₂O₁₁</code> (đường mạch nha) gồm hai gốc α-glucozơ nối với nhau bằng liên kết α-1,4-glicozit. Một đầu vẫn còn nhóm –OH hemiaxetal tự do nên mantozơ có tính khử; thủy phân tạo hai phân tử glucozơ. Mantozơ là sản phẩm của enzim amilaza phân giải tinh bột.'},
{id:'tinhbot',n:'Tinh bột (amilozơ)',geo:'Mạch α-1,4-glicozit; mô hình gồm 3 mắt xích (amilozơ thật xoắn lò xo, mỗi vòng ~6 mắt xích)',typ:'Polisaccarit (C₆H₁₀O₅)ₙ',desc:'Tinh bột <code>(C₆H₁₀O₅)ₙ</code> gồm amilozơ (mạch không phân nhánh, liên kết α-1,4-glicozit, xoắn lò xo) và amilopectin (có thêm nhánh α-1,6). Hình trình bày một đoạn 3 mắt xích α-glucozơ. Tinh bột thủy phân thành glucozơ và cho màu xanh tím với dung dịch iot.'},
{id:'xenlulozo',n:'Xenlulozơ',geo:'Mạch thẳng β-1,4-glicozit; các mắt xích xoay 180° so với nhau; mô hình 3 mắt xích',typ:'Polisaccarit (C₆H₁₀O₅)ₙ',desc:'Xenlulozơ <code>(C₆H₁₀O₅)ₙ</code> gồm các mắt xích β-glucozơ nối bằng liên kết β-1,4-glicozit, mỗi mắt xích xoay 180° so với mắt xích kề nên mạch thẳng. Các mạch xếp song song và liên kết với nhau bằng liên kết hiđro tạo sợi bền, là thành phần chính của thành tế bào thực vật.'},
{id:'metylamin',n:'Metylamin',sm:['CN'],geo:'Tháp tam giác tại N (sp³, còn 1 cặp e tự do); C–N = 1,47 Å',typ:'Amin bậc một (–NH₂)',desc:'Metylamin <code>CH₃NH₂</code>: nguyên tử N còn cặp electron tự do nên metylamin có tính bazơ (nhận H⁺) mạnh hơn amoniac, vì nhóm CH₃ đẩy electron. Các phân tử tạo liên kết hiđro N–H···N.'},
{id:'anilin',n:'Anilin',sm:['c1ccccc1N'],geo:'Vòng benzen phẳng gắn nhóm –NH₂; C–N = 1,40 Å',typ:'Amin thơm bậc một',desc:'Anilin <code>C₆H₅NH₂</code>: cặp electron tự do của N liên hợp với vòng benzen nên tính bazơ rất yếu (yếu hơn amoniac) và vòng thơm dễ bị thế ở vị trí ortho, para (ví dụ tạo kết tủa trắng 2,4,6-tribromanilin với nước brom).'},
{id:'aminoaxit',n:'Amino axit',sm:['NCC(=O)O','CC(N)C(=O)O','OCC(N)C(=O)O'],vl:'Amino axit',vo:['Glyxin','Alanin','Serin'],geo:'Cα lai hóa sp³ gắn nhóm –NH₂, –COOH, H và gốc R',typ:'Hợp chất tạp chức (–NH₂ và –COOH)',desc:'Amino axit <code>H₂N–CHR–COOH</code> chứa đồng thời nhóm amino (tính bazơ) và nhóm cacboxyl (tính axit). Trong dung dịch nước chúng tồn tại chủ yếu dạng ion lưỡng cực H₃N⁺–CHR–COO⁻. Các amino axit nối với nhau bằng liên kết peptit –CO–NH– tạo thành protein.'},
{id:'protein',n:'Protein (xoắn α)',geo:'Cấu trúc bậc 2 dạng xoắn α: 3,6 gốc amino axit mỗi vòng, bước xoắn 5,4 Å, liên kết hiđro giữa gốc i và i+4',typ:'Polipeptit (liên kết peptit –CO–NH–)',desc:'Protein là polipeptit gồm nhiều α-amino axit nối bằng liên kết peptit. Hình vẽ chỉ các nguyên tử Cα (xám) của khung chuỗi xoắn α, các gốc R (xanh lá) hướng ra ngoài và liên kết hiđro (nét đứt) giữa gốc thứ i và i+4 giữ cho chuỗi xoắn bền vững.'}];

Object.assign(EC,{Na:'#a855f7',Cl:'#16a34a',P:'#f97316',bA:'#22c55e',bT:'#ef4444',bG:'#eab308',bC:'#3b82f6'});Object.assign(EV,{Na:1.4,Cl:2.1,P:1,bA:1,bT:1,bG:1,bC:1});Object.assign(EB,{Na:.6,Cl:.95,P:.7,bA:.55,bT:.55,bG:.55,bC:.55});
function naclMol(){const M=mkMol(),d=2.82,id={};for(let i=0;i<3;i++)for(let j=0;j<3;j++)for(let k=0;k<3;k++)id[i+','+j+','+k]=addAt(M,(i+j+k)%2?'Cl':'Na',[i*d,j*d,k*d]);
 for(let i=0;i<3;i++)for(let j=0;j<3;j++)for(let k=0;k<3;k++){const a=id[i+','+j+','+k];[[1,0,0],[0,1,0],[0,0,1]].forEach(([x,y,z])=>{const b=id[(i+x)+','+(j+y)+','+(k+z)];if(b!=null)M.b.push([a,b,.5])})}
 return fin(M)}
function diamondMol(){const M=mkMol(),u=3.567/4,pts=[];for(let i=0;i<=8;i++)for(let j=0;j<=8;j++)for(let k=0;k<=8;k++){const s=i+j+k,ev=i%2==0&&j%2==0&&k%2==0,od=i%2&&j%2&&k%2;if((ev&&s%4==0)||(od&&s%4==3))pts.push([i,j,k])}
 pts.forEach(p=>addAt(M,'C',[p[0]*u,p[1]*u,p[2]*u]));
 for(let a=0;a<pts.length;a++)for(let b=a+1;b<pts.length;b++){const d=(pts[a][0]-pts[b][0])**2+(pts[a][1]-pts[b][1])**2+(pts[a][2]-pts[b][2])**2;if(d==3)M.b.push([a,b,1])}
 return fin(M)}
function graphMol(){const M=mkMol(),a=1.42,s3=Math.sqrt(3),L=[];[0,1].forEach(l=>{const idx=[];for(let m=-3;m<=3;m++)for(let n=-3;n<=3;n++)[[0,0],[0,a]].forEach(([bx,by])=>{const x=m*s3*a+n*s3*a/2+bx,y=n*1.5*a+by;if(Math.hypot(x,y-a/2)<4.6)idx.push(addAt(M,'C',[x,l*3.35,y+(l?a:0)]))});L.push(idx)});
 L.forEach(idx=>{for(let i=0;i<idx.length;i++)for(let j=i+1;j<idx.length;j++){const p=M.a[idx[i]].p,q=M.a[idx[j]].p;if(Math.hypot(p[0]-q[0],p[2]-q[2])<a*1.05)M.b.push([idx[i],idx[j],1])}});
 L[0].forEach(i=>L[1].forEach(j=>{const p=M.a[i].p,q=M.a[j].p;if(Math.hypot(p[0]-q[0],p[2]-q[2])<.05)M.b.push([i,j,.5])}));return fin(M)}
function dnaMol(){const M=mkMol(),seq='ATGCGATCGTAC',cp={A:'T',T:'A',G:'C',C:'G'};let p1=-1,p2=-1;
 for(let i=0;i<seq.length;i++){const t=i*Math.PI/5,z=i*3.4,t2=t+Math.PI-.9,s1=addAt(M,'P',[10*Math.cos(t),z,10*Math.sin(t)]),s2=addAt(M,'P',[10*Math.cos(t2),z,10*Math.sin(t2)]),x1=addAt(M,'b'+seq[i],[3.8*Math.cos(t),z,3.8*Math.sin(t)]),x2=addAt(M,'b'+cp[seq[i]],[3.8*Math.cos(t2),z,3.8*Math.sin(t2)]);
  M.b.push([s1,x1,1],[s2,x2,1],[x1,x2,.5]);if(p1>=0)M.b.push([p1,s1,1],[p2,s2,1]);p1=s1;p2=s2}
 return fin(M)}
function pepMol(){const m=buildS('NCC(=O)NC(C)C(=O)NC(CO)C(=O)O'),hl=new Set();m.b.forEach(([i,j],ix)=>{const a=m.a[i].e,b=m.a[j].e;if((a=='C'&&b=='N')||(a=='N'&&b=='C')){const c=a=='C'?i:j;if(m.b.some(([x,y,o])=>o==2&&(x==c||y==c)&&(m.a[x].e=='O'||m.a[y].e=='O')))hl.add(ix)}});m.hl=hl;return m}
Object.assign(MOLB,{nacl:naclMol,kimcuong:diamondMol,graphit:graphMol,adn:dnaMol,peptit:pepMol});

{id:'nacl',n:'Natri clorua (NaCl)',geo:'Mạng lập phương tâm mặt kiểu muối ăn (rock-salt); mỗi ion được bao quanh bởi 6 ion trái dấu',typ:'Tinh thể ion',desc:'Tinh thể NaCl gồm các ion Na⁺ (tím, nhỏ) và Cl⁻ (xanh lá, lớn) xếp luân phiên trong mạng lập phương; lực hút tĩnh điện giữa các ion trái dấu (nét đứt) giữ chặt mạng tinh thể. Vì vậy NaCl cứng, giòn, nóng chảy ở nhiệt độ cao (801 °C), tan trong nước, và dẫn điện khi nóng chảy hoặc ở dạng dung dịch. Hình vẽ là khối 3×3×3 ion.',xi:()=>[['Loại liên kết','Liên kết ion Na⁺ – Cl⁻'],['Kiểu mạng','Lập phương tâm mặt (rock-salt)'],['Số phối trí','6 : 6'],['Hằng số mạng a','0,564 nm'],['Khoảng cách Na⁺–Cl⁻','0,282 nm'],['Tính chất','Cứng, giòn, tan trong nước, t°nc = 801 °C']]},

 desc:'Lực hấp dẫn của Mặt Trăng (và một phần của Mặt Trời) làm nước biển dâng lên ở hai phía của Trái Đất – phía gần và phía xa Mặt Trăng – nên mỗi ngày có hai lần triều cao (chu kỳ ≈ 12 giờ 25 phút). Khi Mặt Trời, Trái Đất, Mặt Trăng thẳng hàng (sóc, vọng) hai tác dụng cộng lại thành triều cường; khi vuông góc (thượng, hạ huyền) chúng triệt tiêu một phần nên là triều kém. Chấm đỏ là người quan sát quay cùng Trái Đất. Hình không theo tỉ lệ.',
 params:[['age','Tuổi Mặt Trăng (ngày)',0,29.5,.5,0],['sp','Tốc độ (giờ/giây)',1,12,1,4]],

 reset(p){return{t:0}},step(s,p,dt){s.t+=dt},val:()=>0,

Object.assign(EX,{
galv:{name:'🔋 Pin điện hóa (pin Daniell)',nog:true,
 desc:'Pin điện hóa biến hóa năng thành điện năng nhờ phản ứng oxi hóa – khử: kim loại hoạt động hơn (anot, cực âm) nhường electron, electron chạy qua dây dẫn sang catot (cực dương) để khử ion kim loại. Cầu muối nối hai dung dịch, trung hòa điện tích bằng sự di chuyển của các ion. Sức điện động tiêu chuẩn <code>E° = E°_catot − E°_anot</code>; ở nồng độ bất kỳ (phương trình Nernst) <code>E = E° − {0,0592|2}·lg Q</code>.',
 params:[['pair','Cặp điện cực (anot – catot)',0,4,1,0],['ca','Nồng độ ion ở anot (mol/L)',.01,2,.01,1],['cc','Nồng độ ion ở catot (mol/L)',.01,2,.01,1],['R','Điện trở mạch ngoài R (Ω)',5,100,1,20]],
 calc(p){const g=GP[p.pair],E0=g[3]-g[2],Q=p.ca/Math.pow(p.cc,g[6]),E=E0-.0296*Math.log10(Q),I=E/(p.R+2);return{g,E0,E,I}},
 reset(p){return{t:0,ph:0,q:0}},
 step(s,p,dt){const c=EX.galv.calc(p);s.t+=dt;s.ph+=Math.min(1.6,c.I*14)*dt;s.q+=c.I*dt*300},

 draw(s,p){const c=EX.galv.calc(p),g=c.g,bw=Math.min(160,W*.27),bh=H*.4,by=H*.5,xa=W*.27,xc=W*.73,FG=col('--fg'),wear=1-Math.exp(-s.q/9000),dep=1-Math.exp(-s.q/9000),ytop=by-bh*.1,wy=H*.16,sb=H*.34;

   const ew=i?18*(1+dep*.9):18*(1-wear*.55),ec=i?g[8]:g[7];cx.fillStyle=ec;cx.fillRect(x-ew/2,wy+30,ew,by+bh-wy-40);cx.strokeStyle=FG;cx.lineWidth=1.2;cx.strokeRect(x-ew/2,wy+30,ew,by+bh-wy-40);

electro:{name:'⚡ Bình điện phân',nog:true,
 desc:'Bình điện phân biến điện năng thành hóa năng: dòng điện một chiều làm ion di chuyển về các điện cực – cation về catot (cực âm, xảy ra sự khử), anion về anot (cực dương, xảy ra sự oxi hóa). Theo định luật Faraday, lượng chất sinh ra tỉ lệ với điện lượng: <code>m = {A·I·t|n·F}</code> (F = 96485 C/mol); 1 mol khí ở đktc chiếm 22,4 L. 1 giây mô phỏng = 5 phút điện phân.',
 params:[['sys','Dung dịch điện phân',0,3,1,0],['I','Cường độ dòng điện I (A)',.5,5,.5,2]],
 calc(s,p){const e=ES[p.sys],tm=s.t*5,Q=p.I*tm*60,ne=Q/96485,gas=e.gc=='Cu'?0:ne/2*22.4*1000,ga=e.ga=='Cl₂'?ne/2*22.4*1000:e.ga=='O₂'?ne/4*22.4*1000:0,mCu=ne/2*63.55*1000;return{e,tm,Q,ne,gas,ga,mCu}},
 reset(p){return{t:0}},step(s,p,dt){s.t+=dt},val:()=>0,
 info(s,p){const c=EX.electro.calc(s,p),e=c.e,pc=e.gc=='Cu'?f(c.mCu,1)+' mg Cu':f(c.gas,0)+' mL '+e.gc,pa=e.ga=='Cu'?'Tan '+f(c.mCu,1)+' mg Cu':f(c.ga,0)+' mL '+e.ga;return[['Dung dịch',e.n],['Catot (−)',e.c],['Anot (+)',e.a],['Thời gian (ảo)',f(c.tm,1)+' phút'],['Điện lượng Q = It',f(c.Q,0)+' C'],['Số mol electron',f(c.ne*1000,2)+' mmol'],['Sản phẩm ở catot',pc],['Sản phẩm ở anot',pa],['Ghi chú',e.note]]},
 draw(s,p){const c=EX.electro.calc(s,p),e=c.e,FG=col('--fg'),bw=Math.min(300,W*.55),bx=(W-bw)/2,by=H*.42,bh=H*.48,xc=bx+bw*.25,xa=bx+bw*.75,top=by-bh*.55;
  cx.fillStyle=e.col;cx.fillRect(bx,by+bh*.1,bw,bh*.9);cx.strokeStyle=FG;cx.lineWidth=3;cx.beginPath();cx.moveTo(bx,by);cx.lineTo(bx,by+bh);cx.lineTo(bx+bw,by+bh);cx.lineTo(bx+bw,by);cx.stroke();
  const bt=H*.1;cx.fillStyle=col('--card');cx.fillRect(W/2-44,bt-12,88,26);cx.strokeStyle=FG;cx.lineWidth=2;cx.strokeRect(W/2-44,bt-12,88,26);cx.fillStyle=FG;cx.font='bold 14px system-ui';cx.textAlign='center';cx.fillText('−',W/2-28,bt+6);cx.fillText('+',W/2+28,bt+6);cx.font='11px system-ui';cx.fillText('nguồn 1 chiều',W/2,bt+26);cx.textAlign='left';
  ln(W/2-44,bt,xc,bt,FG,2);ln(xc,bt,xc,top+10,FG,2);ln(W/2+44,bt,xa,bt,FG,2);ln(xa,bt,xa,top+10,FG,2);
  const grow=Math.min(1,c.mCu/400),sh=Math.min(1,c.mCu/400);
  const elec=(x,iscat)=>{let w=16;if(e.gc=='Cu'&&e.ga!='Cu'&&iscat)w=16+grow*14;if(e.ga=='Cu'&&iscat)w=16+grow*14;if(e.ga=='Cu'&&!iscat)w=16-sh*7;cx.fillStyle=e.el;cx.fillRect(x-w/2,top+10,w,by+bh-top-30);cx.strokeStyle=FG;cx.lineWidth=1;cx.strokeRect(x-w/2,top+10,w,by+bh-top-30);if(iscat&&e.gc=='Cu'){cx.fillStyle='#b45309';cx.fillRect(x-w/2-1,by+bh*.25,w+2,by+bh-by-bh*.25-22)}};
  elec(xc,true);elec(xa,false);
  const tube=(x,v,k,lab)=>{if(!lab)return;const tw=34,tt=by-bh*.25;cx.strokeStyle=FG;cx.lineWidth=2;cx.strokeRect(x-tw/2,tt-40,tw,bh*.4+40);const fh=Math.min(1,v/150)*(bh*.4+40);cx.fillStyle=k;cx.globalAlpha=.55;cx.fillRect(x-tw/2+1,tt-40+(bh*.4+40)-fh,tw-2,fh);cx.globalAlpha=1;cx.fillStyle=FG;cx.font='bold 12px system-ui';cx.textAlign='center';cx.fillText(lab,x,tt-46);cx.textAlign='left'};
  if(e.gc!='Cu')tube(xc-28,c.gas,'#38bdf8',e.gc);if(e.ga!='Cu')tube(xa+28,c.ga,e.ga=='Cl₂'?'#a3e635':'#e2e8f0',e.ga);
  const bub=(x,on)=>{if(!on)return;for(let i=0;i<7;i++){const u=(i/7+s.t*.9)%1;cx.strokeStyle='#e0f2fe';cx.lineWidth=1.3;cx.beginPath();cx.arc(x+Math.sin(i*5+u*6)*7,by+bh-30-u*bh*.6,2+(i%3),0,7);cx.stroke()}};
  bub(xc+14,e.gc!='Cu');bub(xa-14,e.ga!='Cu');
  cx.font='bold 12px system-ui';for(let i=0;i<8;i++){const u=(i/8+s.t*.12)%1,y=by+bh*.3+((i*37)%50)/50*bh*.4;cx.fillStyle='#dc2626';cx.fillText('+',xa-12-u*(xa-xc-30),y);cx.fillStyle='#2563eb';cx.fillText('−',xc+12+((u+.4)%1)*(xa-xc-30),y+10)}
  cx.fillStyle=FG;cx.textAlign='center';cx.font='bold 13px system-ui';cx.fillText('Catot (−)',xc,by+bh+18);cx.fillText('Anot (+)',xa,by+bh+18);cx.fillStyle=col('--mute');cx.font='12px system-ui';cx.fillText(e.n,W/2,by+bh+36);cx.textAlign='left'}},

photostarch:{name:'🍃 Tạo thành tinh bột ở cây xanh',tw:()=>40,
 desc:'Trong lục lạp, pha sáng dùng năng lượng ánh sáng để tách nước, giải phóng O₂ và tạo ATP, NADPH; pha tối (chu trình Calvin) dùng ATP, NADPH để cố định CO₂ thành glucozơ. Glucozơ được trùng hợp thành tinh bột và tích lũy thành hạt trong lục lạp. Phương trình: <code>6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂</code> rồi <code>nC₆H₁₂O₆ → (C₆H₁₀O₅)ₙ + nH₂O</code>. Nhỏ dung dịch iot: lá có tinh bột hóa xanh tím.',
 params:[['L','Cường độ ánh sáng (%)',0,100,5,70],['C','Nồng độ CO₂ (%)',0,100,5,60],['iod','Thử tinh bột bằng dung dịch iot',0,1,1,0]],
 gl:'Glucozơ trong tế bào (xanh dương) và tinh bột tích lũy (đỏ), đơn vị tùy ý',
 rate(p){return 2*(p.L/(p.L+25))*(p.C/(p.C+20))},

 step(s,p,dt){const r=EX.photostarch.rate(p);s.t+=dt;s.G+=(r-.35*s.G)*dt;s.St+=.35*s.G*.9*dt},
 val:s=>[s.G,s.St],
 info(s,p){const r=EX.photostarch.rate(p);return[['Tốc độ tạo glucozơ',f(r,2)+' đơn vị/s'],['Glucozơ trong tế bào',f(s.G,2)],['Tinh bột tích lũy',f(s.St,2)],['Số hạt tinh bột trong lục lạp',Math.min(14,Math.floor(s.St*1.2))],['Khí O₂ thoát ra',r>.05?'Có':'Không'],['Kết quả thử iot',p.iod?(s.St>.5?'Xanh tím (có tinh bột)':'Vàng nâu (chưa có tinh bột)'):'Chưa thử']]},
 draw(s,p){const cxl=W*.3,cyl=H*.55,rx=Math.min(130,W*.24),ry=rx*.58,I=p.L/100,r=EX.photostarch.rate(p),FG=col('--fg');
  cx.fillStyle='#fde047';cx.globalAlpha=.3+.7*I;cx.beginPath();cx.arc(40,40,16+8*I,0,7);cx.fill();cx.globalAlpha=1;
  for(let i=0;i<4;i++){const u=(i/4+s.t*.4)%1,x=50+u*(cxl-60),y=50+u*(cyl-ry-40);cx.globalAlpha=.25+.75*I;ln(x,y,x+10,y+10,'#f59e0b',2);cx.globalAlpha=1}
  cx.fillStyle='rgba(34,197,94,.25)';cx.strokeStyle='#15803d';cx.lineWidth=4;cx.beginPath();cx.ellipse(cxl,cyl,rx,ry,0,0,7);cx.fill();cx.stroke();cx.lineWidth=1.5;cx.beginPath();cx.ellipse(cxl,cyl,rx-6,ry-6,0,0,7);cx.stroke();
  for(let g=0;g<3;g++)for(let k=0;k<4;k++){cx.fillStyle='#16a34a';cx.fillRect(cxl-rx*.55+g*rx*.32,cyl-ry*.2-k*5+ry*.25,rx*.22,3.5)}
  const n=Math.min(14,Math.floor(s.St*1.2));for(let i=0;i<n;i++){const a=i*2.4,rr=.35+.5*((i*7)%10)/10,x=cxl+rx*.55*rr*Math.cos(a)+rx*.3,y=cyl+ry*.6*rr*Math.sin(a);cx.fillStyle='#fff';cx.strokeStyle='#64748b';cx.lineWidth=1;cx.beginPath();cx.ellipse(x,y,7,5,0,0,7);cx.fill();cx.stroke()}
  cx.font='bold 13px system-ui';cx.fillStyle='#16a34a';cx.fillText('Lục lạp',cxl-24,cyl+ry+22);cx.font='12px system-ui';cx.fillStyle=col('--mute');cx.fillText('hạt tinh bột',cxl+rx*.35,cyl-ry-8);cx.fillText('grana (pha sáng)',cxl-rx*.95,cyl-ry*.55);
  for(let i=0;i<Math.round(p.C/25);i++){const u=(i/4+s.t*.3)%1;cx.fillStyle=FG;cx.fillText('CO₂',10+u*(cxl-rx-20),cyl-12)}
  for(let i=0;i<3;i++){const u=(i/3+s.t*.3)%1;cx.fillStyle='#0284c7';cx.fillText('H₂O',cxl-14,H-8-u*(H-8-cyl-ry))}
  if(r>.05)for(let i=0;i<3;i++){const u=(i/3+s.t*.3)%1;cx.fillStyle='#dc2626';cx.fillText('O₂',cxl+rx*.6+u*60,cyl-ry-10-u*(cyl-ry-50))}
  const lx=W*.72,ly=H*.5,lw=Math.min(120,W*.2),k=Math.min(1,s.St/(s.St+5)),lc=p.iod?mixc('#d9a441',k,false).replace('rgb(','').replace(')','').split(',').map(Number):null;
  cx.fillStyle=p.iod?'rgb('+Math.round(217-(217-30)*k)+','+Math.round(164-(164-27)*k)+','+Math.round(65+(75-65)*k)+')':'#4ade80';cx.strokeStyle='#166534';cx.lineWidth=2;cx.beginPath();cx.moveTo(lx-lw,ly);cx.quadraticCurveTo(lx,ly-lw*.8,lx+lw,ly);cx.quadraticCurveTo(lx,ly+lw*.8,lx-lw,ly);cx.fill();cx.stroke();ln(lx-lw,ly,lx+lw,ly,'#166534',1.5);
  cx.fillStyle=col('--mute');cx.font='12px system-ui';cx.textAlign='center';cx.fillText(p.iod?'Lá sau khi nhỏ dung dịch iot':'Lá (chưa thử iot)',lx,ly+lw*.8+18);cx.textAlign='left';cx.fillText('6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ → tinh bột',10,H-8)}},

digest:{name:'🍞 Chuyển hóa tinh bột trong cơ thể',tw:()=>60,
 desc:'Tinh bột được tiêu hóa dần: ở miệng, amilaza nước bọt cắt tinh bột thành mantozơ (một phần nhỏ); dạ dày có pH ≈ 2 nên amilaza ngừng hoạt động; ở ruột non, amilaza tụy biến tinh bột thành mantozơ rồi maltaza thủy phân mantozơ thành glucozơ. Glucozơ hấp thu vào máu; insulin giúp tế bào lấy glucozơ để hô hấp tạo ATP và dự trữ thừa thành glycogen ở gan và cơ. 1 giây mô phỏng = 4 phút.',
 params:[['amt','Lượng tinh bột ăn vào (g)',20,150,10,80],['act','Hoạt động của cơ thể',0,1,1,0]],
 gl:'Đường huyết (xanh dương, mg/dL) và glycogen dự trữ (đỏ, gam × 10)',
 reset(p){return{t:0,Sm:p.amt,Ss:0,Si:0,M:0,Gl:0,Bl:0,Gy:0,Cn:0,bg:90}},
 step(s,p,dt){const m=dt*4,a1=.5,a2=.08,a3=.12,a4=.2,a5=.1,u=(p.act?.07:.03)*s.Bl,st=.05*s.Bl*(1+s.Bl/3);let d;
  d=a1*s.Sm*m;s.Sm-=d;s.Ss+=.9*d;s.M+=.1*d;d=a2*s.Ss*m;s.Ss-=d;s.Si+=d;d=a3*s.Si*m;s.Si-=d;s.M+=d;d=a4*s.M*m;s.M-=d;s.Gl+=d*1.05;d=a5*s.Gl*m;s.Gl-=d;s.Bl+=d;s.Bl-=(u+st)*m;s.Gy+=st*m;s.Cn+=u*m;s.t+=dt;s.bg=90+20*Math.max(0,s.Bl)},
 val:s=>[s.bg,s.Gy*10],
 info(s,p){return[['Thời gian',f(s.t*4,0)+' phút'],['Tinh bột ở miệng / dạ dày',f(s.Sm,1)+' / '+f(s.Ss,1)+' g'],['Tinh bột ở ruột non',f(s.Si,1)+' g'],['Mantozơ',f(s.M,1)+' g'],['Glucozơ ở ruột non',f(s.Gl,1)+' g'],['Đường huyết',f(s.bg,0)+' mg/dL'],['Glycogen dự trữ',f(s.Gy,1)+' g'],['Glucozơ đã dùng cho hô hấp',f(s.Cn,1)+' g']]},
 draw(s,p){const FG=col('--fg'),bw=W*.16,bh=H*.4,y0=H*.18,xs=[.1,.3,.5,.72,.9].map(v=>W*v-bw/2),names=['Miệng','Dạ dày','Ruột non','Máu','Gan, cơ, tế bào'],sub=['amilaza nước bọt','pH ≈ 2, ngừng amilaza','amilaza tụy + maltaza','glucozơ','glycogen · ATP'];
  const amt=[[s.Sm,0,0],[s.Ss,0,0],[s.Si,s.M,s.Gl],[0,0,Math.max(0,s.Bl)],[0,0,s.Gy]],cl=['#16a34a','#f97316','#eab308'];
  xs.forEach((x,i)=>{cx.fillStyle=col('--card');cx.fillRect(x,y0,bw,bh);cx.strokeStyle=i==2?'#16a34a':FG;cx.lineWidth=i==2?3:1.5;cx.strokeRect(x,y0,bw,bh);cx.fillStyle=FG;cx.font='bold 12px system-ui';cx.textAlign='center';cx.fillText(names[i],x+bw/2,y0-8);cx.fillStyle=col('--mute');cx.font='11px system-ui';cx.fillText(sub[i],x+bw/2,y0+bh+16);
   amt[i].forEach((v,k)=>{const n=Math.min(10,Math.ceil(v/8));for(let j=0;j<n;j++){const yy=y0+12+((j+k*3)%5)*(bh/6)+k*6,xx=x+12+(j%2)*bw*.38+k*bw*.15;cx.fillStyle=cl[k];cx.beginPath();if(k==0){cx.arc(xx,yy,5,0,7);cx.arc(xx+9,yy+3,5,0,7)}else cx.arc(xx,yy,k==1?6:5,0,7);cx.fill()}});
   if(i<4){const fl=[s.Sm>.5,s.Ss>.5,s.Gl>.3||s.Bl>.2,s.Bl>.2][i];const ax=x+bw+4,ay=y0+bh/2;ln(ax,ay,ax+W*.2-bw-8,ay,fl?'#16a34a':col('--line'),3);ah(ax+W*.2-bw-8,ay,0,9,fl?'#16a34a':col('--line'));if(fl)for(let q=0;q<2;q++){const u=(q/2+s.t*.5)%1;cx.fillStyle='#eab308';cx.beginPath();cx.arc(ax+u*(W*.2-bw-12),ay,3.5,0,7);cx.fill()}}});
  cx.textAlign='left';cx.font='12px system-ui';[['Tinh bột','#16a34a'],['Mantozơ','#f97316'],['Glucozơ','#eab308']].forEach(([n,k],i)=>{cx.fillStyle=k;cx.beginPath();cx.arc(16+i*96,H*.8,6,0,7);cx.fill();cx.fillStyle=col('--mute');cx.fillText(n,28+i*96,H*.8+4)});
  cx.fillStyle=col('--mute');cx.fillText('Tinh bột —amilaza→ Mantozơ —maltaza→ Glucozơ → hô hấp tế bào / glycogen',10,H-10)}}
});

// ===== astronomy: seasons, day & night =====
